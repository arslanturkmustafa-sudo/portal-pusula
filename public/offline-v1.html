<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102c2a" />
    <title>Portal Pusula — Bağlantı yok</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #102c2a; background: #f3efe6; font-family: system-ui, sans-serif; }
      main { width: min(100%, 540px); padding: 36px; border: 1px solid rgba(16,44,42,.16); border-radius: 24px; background: #fffdf8; box-shadow: 0 24px 60px rgba(16,44,42,.12); }
      span { display: inline-grid; width: 48px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: #fffdf8; background: #102c2a; font-weight: 800; }
      h1 { margin: 24px 0 12px; font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; letter-spacing: -.04em; }
      p { margin: 0; color: #355451; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">K</span>
      <h1>Bağlantı bekleniyor.</h1>
      <p>Portal Pusula çevrimdışıyken eski müşteri veya finans verisi göstermez. İnternet bağlantınız geri geldiğinde sayfayı yenileyin.</p>
    </main>
  </body>
</html>
